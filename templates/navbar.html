<!-- navbar.html -->
<nav class="navbar navbar-expand-lg sticky-top glass-panel" style="border-radius: 0; border-top: none; border-left: none; border-right: none;" id="mainNavbar">
  <div class="container-fluid px-4">
    <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="/" style="font-size: 1.5rem;">
      <i class="bi bi-globe2 text-gradient"></i> EduSphere
    </a>

    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <i class="bi bi-list fs-2"></i>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-2" id="navLinks">
        <li class="nav-item">
          <a class="nav-link " href="/">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link " href="#about-us">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link " href="#courses">Courses</a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0" id="navAuthSection">
        <a href="/login" class="btn-outline-premium" id="navLoginBtn">Sign In</a>
        <a href="/login?mode=signup" class="btn-premium" id="navSignupBtn">Get Started</a>
      </div>
    </div>
  </div>
</nav>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const nav = document.getElementById("mainNavbar");
    window.addEventListener("scroll", () => {
      if (window.scrollY > 50) {
        nav.style.background = 'rgba(255, 255, 255, 0.95)'; /* light solid */
      } else {
        nav.style.background = 'var(--bg-glass)';
      }
    });

    fetch('/getLoginData', { cache: "no-cache" })
      .then(res => res.json())
      .catch(() => ({}))
      .then(data => {
        const navLinks = document.getElementById('navLinks');
        const authSection = document.getElementById('navAuthSection');
        
        if (data && data.user_name) {
          const firstLetter = data.user_name[0].toUpperCase();
          
          let linksHtml = '';
          if (data.isInstituate) {
            linksHtml += `
              <li class="nav-item"><a class="nav-link " href="/Instituate"><i class="bi bi-grid me-1"></i> Dashboard</a></li>
              <li class="nav-item"><a class="nav-link " href="/publishCourse"><i class="bi bi-cloud-arrow-up me-1"></i> Publish Course</a></li>
              <li class="nav-item"><a class="nav-link " href="/instituate_user"><i class="bi bi-people me-1"></i> Student Manager</a></li>
            `;
          } else {
            linksHtml += `
              <li class="nav-item"><a class="nav-link " href="/home"><i class="bi bi-grid me-1"></i> Dashboard</a></li>
              <li class="nav-item"><a class="nav-link " href="/myCertificates"><i class="bi bi-award me-1"></i> Certificates</a></li>
              <li class="nav-item"><a class="nav-link " href="/home#showCourses"><i class="bi bi-book me-1"></i> Explore Courses</a></li>
            `;
          }
          navLinks.innerHTML = linksHtml;

          const profileLink = data.isInstituate ? '/instituateProfile' : '/userprofile';
          authSection.innerHTML = `
            <a href="${profileLink}" class="d-flex align-items-center gap-2 text-decoration-none px-2 rounded hover-bg-dark" style="transition:0.3s">
              <div class="rounded-circle d-flex justify-content-center align-items-center" style="width: 36px; height: 36px; background: var(--accent-gradient); font-weight: bold; box-shadow: var(--shadow-glow)">
                ${firstLetter}
              </div>
              <span class="fw-semibold text-truncate" style="max-width:120px; text-transform: capitalize;">${data.user_name}</span>
            </a>
            <a href="/logout" class="btn btn-sm btn-outline-danger ms-2 rounded-circle" title="Logout" style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;"><i class="bi bi-box-arrow-right"></i></a>
          `;
        }
      });
  });
</script>
