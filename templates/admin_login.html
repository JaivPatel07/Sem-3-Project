{% extends "base.html" %}

{% block title %}Admin Login | EduSphere{% endblock %}

{% block extra_css %}
<style>
  /* Hide navbar and footer for auth pages */
  nav.navbar { display: none !important; }
  footer { display: none !important; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #f8fafc;
    background-image: 
      radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.1) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.1) 0px, transparent 50%);
    padding-bottom: 40px;
  }

  .auth-card {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border: 1px solid rgba(0, 0, 0, 0.04);
    border-radius: 24px;
    padding: 48px 40px;
    box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.02);
    position: relative;
    overflow: hidden;
  }
  
  .auth-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: var(--accent-gradient);
  }

  .auth-icon-wrapper {
    width: 72px;
    height: 72px;
    background: #eff6ff;
    border: 1px solid #dbeafe;
    color: var(--accent-primary);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
    margin: 0 auto 24px auto;
  }

  h3 {
    color: #1e293b;
    font-weight: 800 !important;
  }

  .form-control {
    background-color: #f8fafc;
    border: 1px solid #e2e8f0;
    color: #1e293b;
    padding: 14px 16px 14px 45px;
    border-radius: 12px;
    font-size: 0.95rem;
    transition: all 0.2s;
  }
  
  .form-control::placeholder {
    color: #94a3b8;
    opacity: 1;
  }

  .form-control:focus {
    background-color: #ffffff;
    border-color: var(--accent-primary);
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
    color: #0f172a;
  }

  .input-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-secondary);
    z-index: 10;
  }

  .back-link {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 0.9rem;
    transition: all 0.2s;
  }
  
  .back-link:hover {
    color: var(--accent-primary);
  }
</style>
{% endblock %}

{% block content %}
<div class="auth-card animate-fade-up">
  <div class="text-center mb-4">
    <div class="auth-icon-wrapper">
      <i class="bi bi-shield-lock-fill"></i>
    </div>
    <h3 class="fw-bold mb-1">Admin Portal</h3>
    <p class="text-secondary small">Secure access for administrators</p>
  </div>
  
  {% if error %}
  <div class="alert alert-danger bg-danger bg-opacity-10 border-danger border-opacity-25 text-danger d-flex align-items-center p-3 mb-4 rounded-3" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
    <div class="small fw-semibold">{{ error }}</div>
  </div>
  {% endif %}

  <form action="/admin/login" method="POST">
    <div class="mb-4 position-relative">
      <label class="form-label text-secondary small fw-semibold text-uppercase letter-spacing-1 mb-2">Email Address</label>
      <i class="bi bi-envelope-fill input-icon"></i>
      <input type="email" name="email" class="form-control " placeholder="admin@edusphere.com" required>
    </div>
    
    <div class="mb-5 position-relative">
      <label class="form-label text-secondary small fw-semibold text-uppercase letter-spacing-1 mb-2">Password</label>
      <i class="bi bi-key-fill input-icon"></i>
      <input type="password" name="password" class="form-control " placeholder="Enter password" required>
    </div>
    
    <button type="submit" class="btn btn-premium w-100 py-3 mb-4 shadow-glow fs-6">
      Sign In <i class="bi bi-arrow-right ms-2"></i>
    </button>
  </form>
  
  <div class="text-center pt-3 border-top" style="border-color: rgba(0,0,0,0.05)!important">
    <a href="/login" class="back-link">
      <i class="bi bi-arrow-left me-1"></i> Back to the Main Login Space
    </a>
  </div>
</div>
{% endblock %}
