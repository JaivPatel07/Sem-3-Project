<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}EduSphere | LMS Platform{% endblock %}</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Global Custom Styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
  
  {% block extra_css %}{% endblock %}
</head>
<body>
  
  <!-- Global Loader -->
  <div id="global-loader" class="glass-panel" style="position: fixed; inset: 0; z-index: 9999; display: flex; justify-content: center; align-items: center; border-radius: 0;">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Include Dynamic Navbar -->
  {% include 'navbar.html' %}

  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Global Footer -->
  <footer class="mt-auto py-4" style="background: var(--bg-surface); border-top: 1px solid rgba(255,255,255,0.05);">
    <div class="container text-center">
      <div class="d-flex justify-content-center gap-4 mb-3">
        <a href="#" class="text-secondary fs-5" style="transition: color 0.3s;"><i class="bi bi-github"></i></a>
        <a href="#" class="text-secondary fs-5" style="transition: color 0.3s;"><i class="bi bi-linkedin"></i></a>
        <a href="#" class="text-secondary fs-5" style="transition: color 0.3s;"><i class="bi bi-twitter-x"></i></a>
      </div>
      <p class="text-secondary mb-0">&copy; 2026 EduSphere Inc. All rights reserved.</p>
    </div>
  </footer>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    // Loader logic
    window.addEventListener('load', () => {
      const loader = document.getElementById('global-loader');
      loader.style.opacity = '0';
      setTimeout(() => {
        loader.style.display = 'none';
      }, 300);
    });
  </script>
  
  <!-- Toast Container for global notifications -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

  <script>
    function showGlobalToast(message, type='success') {
      const toastContainer = document.getElementById('toastContainer');
      const bgClass = type === 'error' ? 'bg-danger' : 'bg-success';
      const toastHtml = `
        <div class="toast align-items-center text-white ${bgClass} border-0" role="alert" aria-live="assertive" aria-atomic="true">
          <div class="d-flex">
            <div class="toast-body">
              ${message}
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
          </div>
        </div>
      `;
      toastContainer.insertAdjacentHTML('beforeend', toastHtml);
      const newToast = toastContainer.lastElementChild;
      const bsToast = new bootstrap.Toast(newToast);
      bsToast.show();
      
      newToast.addEventListener('hidden.bs.toast', () => {
        newToast.remove();
      });
    }
  </script>

  {% block extra_js %}{% endblock %}
</body>
</html>
