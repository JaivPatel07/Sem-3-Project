{% extends "base.html" %}

{% block title %}Verify OTP | EduSphere{% endblock %}

{% block extra_css %}
<style>
  /* Hide navbar and footer for auth pages */
  nav.navbar { display: none !important; }
  footer { display: none !important; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, rgba(16, 185, 129, 0.15) 0%, var(--bg-dark) 100%);
  }

  .auth-card {
    width: 100%;
    max-width: 400px;
    background: var(--bg-surface);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: var(--border-radius);
    padding: 40px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  }
  
  .auth-icon-wrapper {
    width: 70px;
    height: 70px;
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.2);
    color: var(--success);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    margin: 0 auto 24px auto;
    box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
  }

  .form-control {
    background-color: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: white;
    padding-top: 15px;
    padding-bottom: 15px;
    border-radius: 10px;
    text-align: center;
    font-size: 1.5rem;
    letter-spacing: 5px;
    font-weight: 700;
  }

  .form-control:focus {
    background-color: rgba(255,255,255,0.08);
    border-color: var(--success);
    color: white;
    box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
  }

  /* Hide arrow keys in number input */
  input[type="number"]::-webkit-inner-spin-button, 
  input[type="number"]::-webkit-outer-spin-button { 
    -webkit-appearance: none; 
    margin: 0; 
  }
  input[type="number"] {
    -moz-appearance: textfield;
  }
</style>
{% endblock %}

{% block content %}
<div class="auth-card animate-fade-up">
  <div class="text-center mb-4">
    <div class="auth-icon-wrapper">
      <i class="bi bi-shield-check"></i>
    </div>
    <h3 class="fw-bold mb-1">Verify Your Email</h3>
    <p class="text-secondary small">Enter the 6-digit OTP sent to your email.</p>
  </div>

  {% if error %}
  <div class="alert alert-danger bg-danger bg-opacity-10 border-danger border-opacity-25 text-danger p-2 mb-4 fs-6 rounded-3 text-center" role="alert">
    <i class="bi bi-exclamation-circle-fill me-2"></i>{{ error }}
  </div>
  {% endif %}

  <form method="POST">
    <div class="mb-4">
      <input type="number" name="otp" class="form-control " placeholder="------" required autofocus autocomplete="off">
    </div>
    <button type="submit" class="btn btn-outline-premium w-100 py-3 mb-3 border-success text-success fs-6 fw-bold">
      <i class="bi bi-check-circle-fill me-2"></i> Verify OTP
    </button>
  </form>

  <p class="text-secondary small text-center mb-0 mt-4">
    <i class="bi bi-info-circle me-1"></i> OTP expires soon for security.
  </p>
</div>

<script>
  // Focus effect
  const input = document.querySelector('input[type="number"]');
  input.addEventListener('input', function() {
    if (this.value.length > 6) {
      this.value = this.value.slice(0, 6);
    }
  });
</script>
{% endblock %}
