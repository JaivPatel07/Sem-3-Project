{% extends "base.html" %}

{% block title %}My Certificates | EduSphere{% endblock %}

{% block content %}
<div class="container mt-5 mb-5 animate-fade-up">
  <!-- Header -->
  <div class="mb-5 text-center">
    <div class="bg-primary bg-opacity-25 rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 80px; height: 80px;">
      <i class="bi bi-award fs-1 text-primary"></i>
    </div>
    <h2 class="fw-bold mb-2">My Certificates</h2>
    <p class="text-secondary mb-0">
      Showcase your completed courses and achievements.
    </p>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-8" id="certificateList">
      <!-- Certificate list will be shown by js -->
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static',filename='js/certificate_ls.js') }}"></script>
{% endblock %}
